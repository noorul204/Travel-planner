<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Travel Planner — Weather</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="weather.html">Weather</a>
    <a href="currency.html">Currency</a>
    <a href="about.html">About</a>
  </nav>

  <div class="container">
    <h1>Check City Weather ☀️</h1>

    <!-- Search Form -->
    <form id="searchForm">
      <input id="cityInput" placeholder="Enter city name" />
      <button type="submit">Search</button>
    </form>

    <!-- Loader -->
    <div id="loader" style="display:none;">⏳ Loading...</div>

    <!-- Map & Weather -->
    <div id="map" style="height: 400px;"></div>
    <div id="weather"></div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const weatherDiv = document.getElementById('weather');
    const loader = document.getElementById('loader');
    let map;

    function showMap(lat, lon) {
      if (!map) {
        map = L.map('map').setView([lat, lon], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors'
        }).addTo(map);
      } else {
        map.setView([lat, lon], 10);
      }
      L.marker([lat, lon]).addTo(map)
        .bindPopup("📍 City Location")
        .openPopup();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const city = document.getElementById('cityInput').value.trim();
      if (!city) {
        weatherDiv.textContent = "⚠️ Please type a city name.";
        return;
      }

      const apiKey = "c4c2916254bd296dfe150ccc21840e29"; 
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

      try {
        loader.style.display = "block";
        const response = await fetch(url);
        if (!response.ok) throw new Error("City not found");

        const data = await response.json();
        loader.style.display = "none";

        weatherDiv.innerHTML = `
          <h2>Weather in ${data.name}</h2>
          <p>🌡️ Temperature: ${data.main.temp}°C</p>
          <p>☁️ Condition: ${data.weather[0].description}</p>
          <p>💧 Humidity: ${data.main.humidity}%</p>
        `;

        // Suggestion
        let suggestion = "";
        const condition = data.weather[0].main.toLowerCase();
        if (condition.includes("rain") || condition.includes("thunderstorm")) {
          suggestion = "☔ Don’t forget your umbrella!";
        } else if (data.main.temp > 30) {
          suggestion = "😎 Perfect beach weather!";
        } else if (data.main.temp < 20) {
          suggestion = "🧥 It’s chilly! Pack warm clothes.";
        } else {
          suggestion = "🚶 Great day for sightseeing!";
        }
        weatherDiv.innerHTML += `<p>${suggestion}</p>`;

        const localTime = new Date((data.dt + data.timezone) * 1000).toUTCString().slice(0, 25);
        weatherDiv.innerHTML += `<p>🕒 Local Time: ${localTime}</p>`;

        showMap(data.coord.lat, data.coord.lon);

      } catch (err) {
        loader.style.display = "none";
        weatherDiv.textContent = "❌ " + err.message;
      }
    });
  </script>
</body>
</html>
