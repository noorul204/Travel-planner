<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Travel Planner — Currency</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="weather.html">Weather</a>
    <a href="currency.html">Currency</a>
    <a href="about.html">About</a>
  </nav>

  <div class="container">
    <h1>Currency Converter 💱</h1>
    <label for="currency">Convert INR to:</label>
    <select id="currency">
      <option value="USD">USD</option>
      <option value="EUR">EUR</option>
      <option value="GBP">GBP</option>
      <option value="JPY">JPY</option>
    </select>
    <button id="convertBtn">Show Rate</button>
    <div id="exchange"></div>
  </div>

  <script>
    document.getElementById('convertBtn').addEventListener('click', async () => {
      const currency = document.getElementById('currency').value;
      try {
        const response = await fetch('https://open.er-api.com/v6/latest/INR');
        const data = await response.json();
        const rate = data.rates[currency];
        document.getElementById('exchange').textContent = `💱 1 INR = ${rate} ${currency}`;
      } catch {
        document.getElementById('exchange').textContent = "❌ Unable to fetch rate";
      }
    });
  </script>
</body>
</html>
